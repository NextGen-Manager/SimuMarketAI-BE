[project]
name = "simumarket-oasis-spike"
version = "0.1.0"
description = "Disposable OASIS feasibility spike for SimuMarket AI"
requires-python = ">=3.11,<3.12"
dependencies = [
    "camel-ai==0.2.78",
    "camel-oasis==0.2.5",
    "mcp>=1.3,<2",
    "pydantic>=2.10,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
