[project]
name = "simumarket-ai-backend"
version = "0.1.0"
description = "SimuMarket AI backend: deterministic engines, OASIS integration, and API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.136.0",
    "uvicorn[standard]>=0.34,<0.40",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2",
    "redis>=5.2,<6",
    "celery>=5.4,<6",
    "pwdlib[argon2]>=0.3,<1",
    "pyjwt>=2.10,<3",
    "email-validator>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "httpx>=0.28,<1",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "aiosqlite>=0.20,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Markdown carries the coding rules and documentation. Formatting the Python
# blocks inside it rewrites prose that is deliberate.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

# camel-oasis lives in the isolated spike environment, not in the backend
# lockfile, so the live adapter imports it lazily and mypy cannot see stubs.
[[tool.mypy.overrides]]
module = ["oasis.*", "camel.*"]
ignore_missing_imports = true

# Celery's task decorator is untyped upstream; the task body itself stays typed.
[[tool.mypy.overrides]]
module = ["app.workers.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
