name: simumarket-ai

services:
  api:
    build:
      context: .
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://simumarket:simumarket@postgres:5432/simumarket
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    # pgvector ships preinstalled so the extension can be enabled by migration
    # without rebuilding the image later.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: simumarket
      POSTGRES_PASSWORD: simumarket
      POSTGRES_DB: simumarket
    ports:
      # 5433 on the host: a locally installed PostgreSQL commonly owns 5432, and
      # the conflict surfaces as a confusing authentication failure rather than a
      # port-in-use error.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simumarket -d simumarket"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
