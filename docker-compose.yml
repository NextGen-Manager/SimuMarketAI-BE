name: simumarket-ai

services:
  api:
    build:
      context: .
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://simumarket:simumarket@postgres:5432/simumarket
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # docs/11 keeps the worker off the API container so a slow simulation cannot
  # block an ordinary web request.
  worker:
    build:
      context: .
      args:
        # Only the worker gets the OASIS runtime. Without it the live adapter
        # raises `OasisUnavailableError` and every run is honestly `partial`.
        INSTALL_OASIS: "1"
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - app.workers.celery_app
      - worker
      - --loglevel=info
      - --queues=analysis
      # One task at a time: a run holds a provider budget, and prefetching a
      # second one only makes queue age harder to read.
      - --concurrency=1
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://simumarket:simumarket@postgres:5432/simumarket
      REDIS_URL: redis://redis:6379/0
      OASIS_TRACE_ROOT: /var/lib/simumarket/oasis-traces
    volumes:
      # OASIS writes one trace directory per run. Keeping them on a named volume
      # means retention is a deliberate job, not an implicit container restart.
      - oasis-traces:/var/lib/simumarket/oasis-traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The reconciler from docs/11. Without a beat process, a run whose dispatch
  # failed or whose worker died would sit non-terminal forever, because nothing
  # in Celery can notice a task that never arrived.
  beat:
    build:
      context: .
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - app.workers.celery_app
      - beat
      - --loglevel=info
      - --schedule=/tmp/celerybeat-schedule
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://simumarket:simumarket@postgres:5432/simumarket
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    # pgvector ships preinstalled so the extension can be enabled by migration
    # without rebuilding the image later.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: simumarket
      POSTGRES_PASSWORD: simumarket
      POSTGRES_DB: simumarket
    ports:
      # 5433 on the host: a locally installed PostgreSQL commonly owns 5432, and
      # the conflict surfaces as a confusing authentication failure rather than a
      # port-in-use error.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simumarket -d simumarket"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  oasis-traces:
